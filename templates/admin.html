<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Los Girasoles</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        input, select, button { padding: 8px; margin: 4px; border-radius: 4px; border: none; }
        button { cursor: pointer; font-weight: bold; }
        .btn-add { background: #27ae60; color: white; }
        .btn-edit { background: #2980b9; color: white; }
        .btn-del { background: #c0392b; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>Panel de Administración - Los Girasoles</h1>
        <div>
            <span>Hola, <strong>{{ session['username'] }}</strong></span> | 
            <a href="/logout" style="color: #ff6b6b;">Cerrar sesión</a>
        </div>
    </div>

    <div class="card">
        <h3>Añadir Nuevo Producto</h3>
        <form action="/admin/productos/agregar" method="POST">
            <select name="categoria_id" required>
                {% for cat in categorias %}
                    <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
            <input type="text" name="nombre" placeholder="Nombre del producto" required>
            <input type="number" step="0.01" name="precio" placeholder="Precio ($)" required>
            <input type="number" name="stock" placeholder="Stock" required>
            <button type="submit" class="btn-add">+ Agregar</button>
        </form>
    </div>

    <div class="card">
        <h3>Inventario Actual</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Categoría</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <form action="/admin/productos/editar/{{ p.id }}" method="POST">
                        <td>{{ p.id }}</td>
                        <td>
                            <select name="categoria_id">
                                {% for cat in categorias %}
                                    <option value="{{ cat.id }}" {% if cat.id == p.categoria_id %}selected{% endif %}>{{ cat.nombre }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td><input type="text" name="nombre" value="{{ p.nombre }}" required></td>
                        <td><input type="number" step="0.01" name="precio" value="{{ p.precio }}" required></td>
                        <td><input type="number" name="stock" value="{{ p.stock }}" required></td>
                        <td>
                            <button type="submit" class="btn-edit">Guardar</button>
                    </form>
                    <form action="/admin/productos/eliminar/{{ p.id }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn-del" onclick="return confirm('¿Seguro que quieres eliminar este producto?')">Eliminar</button>
                    </form>
                        </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
