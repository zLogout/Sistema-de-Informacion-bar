<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Administrador</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/js/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/js/login.css') }}">
</head>
<body>
    <main class="login-page">
        <div class="login-container">
            <a class="login-back" href="{{ url_for('home') }}">&larr; Volver al inicio</a>
            <section class="login-card" aria-labelledby="login-title">
                <p class="eyebrow">Área privada</p>
                <h1 id="login-title">Acceso administrador</h1>
                <p class="lead">Inicia sesión para administrar la carta del bar.</p>

                {% if error %}
                    <p class="login-error" role="alert">{{ error }}</p>
                {% endif %}

                <form class="login-form" method="POST" action="{{ url_for('login') }}">
                    <div class="login-field">
                        <label for="username">Usuario</label>
                        <input id="username" type="text" name="username" autocomplete="username" required>
                    </div>
                    <div class="login-field">
                        <label for="password">Contraseña</label>
                        <input id="password" type="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn pri login-submit" type="submit">Iniciar sesión</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
