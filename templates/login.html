<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Administrador</title>
    <style>
        .login-box { max-width: 380px; margin: 80px auto; padding: 30px; background: #1e1e1e; color: white; border-radius: 10px; font-family: sans-serif; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 10px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .error { color: #ff6b6b; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acceso Administrador</h2>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="admin" required>

            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit">Entrar</button>
        </form>
        <p style="text-align:center; margin-top:15px;"><a href="/" style="color:#ccc;">Volver al inicio</a></p>
    </div>
</body>
</html>
